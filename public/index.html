<style>
:root{--bg:#FFFFFF;--soft:#F6F4F1;--ink:#121212;--mute:#6C6A66;--line:#E8E5E0;--star:#C99A2E;--sale:#A8322D;--ok:#1B7F4B;--wa:#12A150;--serif:"Sora",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--soft);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.logo{font:700 26px/1 var(--serif);letter-spacing:-.03em;background:none;border:0;padding:0}
.sw{flex:1;max-width:620px;position:relative}
.search{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:0 14px}
.search:focus-within{border-color:var(--ink);background:#fff}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;padding:11px 0;outline:none}
.search svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.12);overflow:hidden;display:none}
.sug.on{display:block}
.sug button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 16px}
.sug button:hover{background:var(--soft)}
.hb{background:none;border:0;display:flex;align-items:center;gap:7px;font-weight:600;padding:8px 6px;white-space:nowrap}
.hb em{font-style:normal;background:var(--ink);color:#fff;border-radius:99px;min-width:20px;padding:0 6px;font-size:12px;text-align:center}
.cats{background:var(--bg);border-bottom:1px solid var(--line)}
.cats div{max-width:1280px;margin:auto;padding:10px 20px;display:flex;gap:30px;overflow-x:auto;justify-content:center}
.cats button{background:none;border:0;display:grid;justify-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.cats i{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.cats svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1280px;margin:auto;padding:16px 20px 90px;min-height:70vh}
.box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.car{position:relative;border-radius:16px;overflow:hidden;margin-bottom:16px;height:clamp(180px,30vw,340px)}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 7%;opacity:0;transition:opacity .6s;color:#fff}
.sl.on{opacity:1}
.sl h2{font:700 clamp(24px,4.4vw,52px)/1.1 var(--serif);letter-spacing:-.03em;margin:0 0 10px;max-width:16ch}
.sl p{margin:0 0 16px;max-width:36ch;opacity:.85}
.sl button{align-self:flex-start;background:#fff;color:var(--ink);border:0;border-radius:99px;padding:11px 24px;font-weight:600}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h2.t{font:700 21px/1.2 var(--serif);letter-spacing:-.02em;margin:0}
.va{background:var(--ink);color:#fff;border:0;border-radius:99px;padding:8px 18px;font-weight:600;font-size:13px}
.hs{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.hs .card{min-width:180px;max-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.pic{aspect-ratio:1;border-radius:14px;position:relative;display:grid;place-items:center;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic svg{width:44%;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;font-size:18px;color:#9a968f;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2}
.heart.on{color:#d6334a}
.card h3{margin:4px 0 0;font:600 15px/1.3 var(--serif);letter-spacing:-.01em}
.cat{color:var(--mute);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--ok);color:#fff;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px}
.rate{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price strong{font-size:17px;font-weight:600}
.price s{color:var(--mute);font-size:13.5px}
.price b{color:var(--ok);font-size:13px;font-weight:600}
.rank{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;z-index:2}
.lay{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.flt{padding:18px;position:sticky;top:130px}
.flt h4{margin:18px 0 8px;font:600 14px var(--serif)}
.flt h4:first-child{margin-top:0}
.flt label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.flt input[type=range]{width:100%;accent-color:var(--ink)}
.ftog{display:none}
.tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 18px}
.tabs button{background:var(--soft);border:1px solid transparent;border-radius:99px;padding:7px 15px;font-weight:500;font-size:13.5px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.stars{--p:0%;font-size:15px;letter-spacing:1px;background:linear-gradient(90deg,var(--star) var(--p),#D9D5CE var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.back{background:none;border:0;color:var(--mute);padding:4px 0 12px;font-weight:500}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:36px;align-items:start}
.gal{display:grid;grid-template-columns:70px 1fr;gap:12px;position:sticky;top:130px}
.th2{display:grid;gap:10px;align-content:start}
.th2 button{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);padding:0;overflow:hidden;display:grid;place-items:center}
.th2 button.on{border-color:var(--ink)}
.th2 svg{width:58%;stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round}
.pd h1{font:700 clamp(22px,3vw,30px)/1.2 var(--serif);letter-spacing:-.02em;margin:4px 0 8px}
.pd .price strong{font-size:30px}
.sec{border-top:1px solid var(--line);padding:16px 0}
.sec h4{margin:0 0 10px;font:600 16px var(--serif)}
.sec ul{margin:0;padding-left:18px}
.sec li{margin:4px 0}
.offer li{list-style:none;margin-left:-18px}
.offer b{color:var(--ok)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.cta{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:600;font-size:15px}
.cta.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.wa{display:flex;justify-content:center;gap:8px;background:var(--wa);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:600;font-size:15px;width:100%}
.wa:disabled{opacity:.4;cursor:not-allowed}
.pin{display:flex;gap:8px}
.pin input,.fm input,.fm textarea{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;width:100%}
.pin button{background:none;border:0;font-weight:600;color:var(--ink);text-decoration:underline;white-space:nowrap}
.qty{display:inline-flex;align-items:center;gap:12px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:50%}
table{width:100%;border-collapse:collapse}
td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--mute);width:38%}
.rs{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:center}
.rs big{font:700 44px var(--serif)}
.bars{display:grid;gap:6px}
.bars div{display:grid;grid-template-columns:30px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.bars span.b{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bars span.b i{display:block;height:100%;background:var(--ok)}
.rev{border-bottom:1px solid var(--line);padding:14px 0}
.rev p{margin:6px 0 0}
.fm{display:grid;gap:12px;max-width:520px}
.pick{display:flex;gap:4px}
.pick button{background:none;border:0;font-size:30px;line-height:1;color:#D9D5CE;padding:0 2px}
.pick button.on{color:var(--star)}
.err{color:var(--sale);font-size:13px;min-height:18px;margin:0}
.cl{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.row{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.row .pic{border-radius:12px}
.row .lk{display:flex;gap:16px;margin-top:8px}
.row .lk button{background:none;border:0;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.pr div{display:flex;justify-content:space-between;padding:7px 0}
.pr .tt{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font:700 18px var(--serif)}
.empty{text-align:center;color:var(--mute);padding:60px 0}
.empty button{margin-top:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab svg{width:30px;height:30px;fill:#fff}
footer{background:var(--ink);color:#bdb9b2;text-align:center;font-size:13.5px;padding:30px 22px 50px}
@media (max-width:860px){.lay,.pd,.cl{grid-template-columns:1fr}.gal{position:static;grid-template-columns:1fr}.th2{grid-template-columns:repeat(3,64px);order:2}.flt{display:none;position:static}.flt.open{display:block}.ftog{display:inline-block}.bar{gap:10px;padding:10px 14px}.logo{font-size:21px}.hb span{display:none}main{padding:12px 12px 90px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.cats div{justify-content:flex-start;gap:20px}.rs{grid-template-columns:1fr}.pd{gap:18px}.box{padding:14px}}
@media (max-width:480px){.logo{display:none}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bump{40%{transform:scale(1.55)}}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 0 rgba(18,161,80,.5)}70%{box-shadow:0 8px 24px rgba(0,0,0,.25),0 0 0 16px rgba(18,161,80,0)}}
body{background:linear-gradient(180deg,#F8F6F3,#EEEAE4) fixed}
header{background:rgba(255,255,255,.86);backdrop-filter:blur(14px)}
.logo::after{content:".";color:var(--star)}
.hb{transition:transform .2s}.hb:hover{transform:translateY(-2px)}
.hb em{display:inline-block}.hb em.bump{animation:bump .45s}

.logo .lm{height:42px;width:auto;transition:transform .4s cubic-bezier(.2,.8,.2,1)}.logo:hover .lm{transform:scale(1.08) rotate(-3deg)}
.logo .lw{height:18px;width:auto}
footer{background:#fff;color:var(--mute);border-top:1px solid var(--line)}
footer .fl{height:22px;width:auto;margin-bottom:12px}
.splash{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;animation:splashOut .6s 1.8s forwards}
.splash .sm{width:170px;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.splash .swd{width:240px;max-width:70vw;animation:rise .9s .3s both}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.bar .logo{margin-right:auto}
.sbar{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px}
.sbar .sw{max-width:720px;margin:0 auto}
.sbar .search{padding:0 18px;border:1px solid var(--line);background:var(--soft)}
.sbar .search input{padding:13px 0;font-size:15.5px}
@media (max-width:480px){.bar{gap:8px;padding:10px 12px}.logo{gap:8px}.logo .lm{height:36px}.logo .lw{height:15px}.sbar{padding:10px 12px}.hb{padding:8px 2px}}
@media (prefers-reduced-motion:reduce){.splash{display:none}}
.vopts{display:flex;gap:8px;flex-wrap:wrap}.vopt{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600}.vopt.on{background:var(--ink);color:#fff;border-color:var(--ink)}.vopt:disabled{opacity:.4;text-decoration:line-through}.stk{margin:8px 0 0;font-weight:600}.stk.out{color:var(--sale)}.stk.low{color:#9a6a00}.fpol{margin:0 10px}.policy{white-space:pre-wrap;line-height:1.7;margin-top:12px}footer .fc{margin:10px 0;font-size:13.5px}a.wa{text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1!important;transform:none!important}}
</style>
